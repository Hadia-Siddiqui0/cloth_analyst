# Render.com deploy config -- point Render at this repo and it reads this
# file automatically. Alternative: Railway also works fine with just the
# Dockerfile, no extra config needed there.
services:
  - type: web
    name: textile-bi-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textile-bi-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        # Placeholder -- update this AFTER the frontend is deployed on Vercel,
        # to the real Vercel URL (e.g. ["https://your-app.vercel.app"]).
        # Must stay valid JSON list syntax, including the brackets.
        value: '["http://localhost:3000"]'

databases:
  - name: textile-bi-db
    plan: free
    region: singapore
