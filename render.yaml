# Render.com deploy config -- point Render at this repo and it reads this
# file automatically. Alternative: Railway also works fine with just the
# Dockerfile, no extra config needed there.
services:
  - type: web
    name: textile-bi-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-urd && cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: textile-bi-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://cloth-analyst.vercel.app"]'
      - key: PYTHON_VERSION
        # Render defaults new services to Python 3.14 as of Feb 2026 --
        # pandas==2.2.2 has no pre-built wheel for it and fails trying to
        # compile from source. Pin to a version with known-good wheels.
        value: 3.12.7

databases:
  - name: textile-bi-db
    plan: free
    region: singapore
